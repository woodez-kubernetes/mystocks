<div class="modal-header">
    <h5 class="modal-title text-danger">
        <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="post"
      action="{% url delete_url delete_url_pk %}"
      {% if object_type == 'lot' %}
          hx-post="{% url delete_url delete_url_pk %}"
          hx-target="#holdings-container"
          hx-swap="innerHTML"
      {% else %}
          hx-post="{% url delete_url delete_url_pk %}"
          hx-target="body"
      {% endif %}>
    {% csrf_token %}
    <div class="modal-body">
        <p>Are you sure you want to delete this {{ object_type }}?</p>
        <div class="alert alert-warning">
            <strong>{{ object }}</strong>
            {% if object_type == 'portfolio' %}
                <br><small class="text-muted">This will also delete all lots in this portfolio.</small>
            {% endif %}
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>Delete
        </button>
    </div>
</form>
