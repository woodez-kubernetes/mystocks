<div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="post"
      {% if action_url_pk %}
          action="{% url action_url action_url_pk %}"
      {% else %}
          action="{% url action_url %}"
      {% endif %}
      hx-post="{% if action_url_pk %}{% url action_url action_url_pk %}{% else %}{% url action_url %}{% endif %}"
      hx-target="#modal-container"
      hx-swap="innerHTML">
    {% csrf_token %}
    <div class="modal-body">
        {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                {% for error in field.errors %}
                <div class="invalid-feedback d-block">{{ error }}</div>
                {% endfor %}
            {% endif %}
        </div>
        {% endfor %}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            {% if portfolio %}<i class="bi bi-check-lg me-1"></i>Save Changes{% else %}<i class="bi bi-plus-lg me-1"></i>Create{% endif %}
        </button>
    </div>
</form>
